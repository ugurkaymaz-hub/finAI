version: "3.8"

services:
    user_service:
        build: ./user_service
        container_name: user_service
        ports:
            - "8001:8000"
        depends_on:
            - db
        environment:
            DATABASE_URL: postgresql://postgres:postgres@db:5432/user_db

    product_service:
        build: ./product_service
        container_name: product_service
        ports:
            - "8002:8000"
        depends_on:
            - db
        environment:
            DATABASE_URL: postgresql://postgres:postgres@db:5432/product_db

    db:
        image: postgres:15
        container_name: postgres_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: user_db
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
